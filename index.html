<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Car Rental – Login</title>
    <link rel="stylesheet" href="style-login.css">
</head>
<body>

<div class="container">
    <div class="left">
        <h1>Carent.ci</h1>
        <p>Gestion simple et rapide des locations de voitures</p>
    </div>

    <div class="right">
        <h2>Connexion</h2>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Nom d'utilisateur" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>

        <p class="note">Démo interne – accès sécurisé</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
